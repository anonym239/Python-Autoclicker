name: Windows-Build

# Baut bei jedem Push die AutoClicker.exe + Installer.
# Bei einem Versions-Tag (z. B. v6.2) wird automatisch ein Release mit beiden Dateien erstellt.
on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: PyInstaller installieren
        run: python -m pip install pyinstaller==6.22.3

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          "ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: EXE und Installer bauen
        run: python tools/build_windows.py

      - name: Prüfen, ob alles da ist
        shell: pwsh
        run: |
          Get-ChildItem dist
          if (-not (Test-Path dist\AutoClicker-Setup-*.exe)) { throw "Installer fehlt" }

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Windows
          path: |
            dist/AutoClicker-Setup-*.exe
            dist/AutoClicker-*-portable.zip

      - name: Release erstellen bzw. Dateien anhängen
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}" } else { "${{ github.ref_name }}" }
          $files = Get-ChildItem dist\AutoClicker-Setup-*.exe, dist\AutoClicker-*-portable.zip | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = "**Download:** ``AutoClicker-Setup-*.exe`` herunterladen und starten.`n`nOhne Installation: die ``portable.zip`` entpacken und ``AutoClicker.exe`` starten.`n`nWindows-Warnung „Der Computer wurde durch Windows geschützt“: **Weitere Informationen → Trotzdem ausführen**."
            gh release create $tag $files --title "AutoClicker $($tag.TrimStart('v'))" --notes $notes
          } else {
            gh release upload $tag $files --clobber
          }
