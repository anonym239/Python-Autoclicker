name: Windows-Build

# Baut bei jedem Push die AutoClicker.exe + Installer.
# Landet eine neue Version (clicker/__init__.py) in main, wird automatisch ein Release
# mit Setup + ZIP erstellt. Die App zeigt das Update dann von selbst an.
on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: PyInstaller und pywebview installieren
        run: python -m pip install pyinstaller==6.22.3 pywebview==6.2.1

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          "ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: EXE und Installer bauen
        run: python tools/build_windows.py

      - name: Prüfen, ob alles da ist
        shell: pwsh
        run: |
          Get-ChildItem dist
          if (-not (Test-Path dist\AutoClicker-Setup-*.exe)) { throw "Installer fehlt" }

      - name: Selbsttest - startet das eigene Programmfenster?
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process dist\AutoClicker\AutoClicker.exe -ArgumentList "--selftest", "`"$out`"" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "Selbsttest haengt" }
          $result = (Get-Content $out -ErrorAction SilentlyContinue | Out-String).Trim()
          Write-Host "Ergebnis: $result"
          if ($result -ne "native ok") { throw "Eigenes Programmfenster startet nicht: $result" }

      - name: Bildschirmaufnahme pruefen (nur Info)
        continue-on-error: true
        run: python tools/capture_check.py

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Windows
          path: |
            dist/AutoClicker-Setup-*.exe
            dist/AutoClicker-*-portable.zip

      - name: Release erstellen bzw. Dateien anhängen
        # Neue Version in main -> Release automatisch. Tag v… oder manuelles Release -> Dateien anhängen.
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import clicker; print(clicker.VERSION)"
          if ("${{ github.event_name }}" -eq "release") { $tag = "${{ github.event.release.tag_name }}" }
          elseif ("${{ github.ref }}".StartsWith("refs/tags/")) { $tag = "${{ github.ref_name }}" }
          else { $tag = "v$version" }
          $files = Get-ChildItem dist\AutoClicker-Setup-*.exe, dist\AutoClicker-*-portable.zip | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists -and "${{ github.ref }}" -eq "refs/heads/main") {
            $assets = gh release view $tag --json assets --jq ".assets[].name"
            if ($assets -contains "AutoClicker-Setup-$version.exe") {
              Write-Host "Release $tag gibt es schon - nichts zu tun."
              exit 0
            }
            # Release wurde von Hand angelegt (z. B. mit alten Dateien) -> richtige Dateien hochladen
            foreach ($a in $assets) {
              if ($a -like "AutoClicker-*" -and $a -notlike "*-$version*") { gh release delete-asset $tag $a --yes }
            }
            gh release upload $tag $files --clobber
            gh release edit $tag --title "AutoClicker $version" --notes-file installer/release_notes.md
            exit 0
          }
          if ($exists) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --target "${{ github.sha }}" --title "AutoClicker $version" --notes-file installer/release_notes.md
          }
